<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldDrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c276" />
      <stop offset="50%" stop-color="#d99b43" />
      <stop offset="100%" stop-color="#9a5b18" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a241f" />
      <stop offset="100%" stop-color="#14110e" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="#14110e"/>
  <rect width="98" height="98" x="1" y="1" rx="27" stroke="url(#goldDrip)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Coffee Drip / Cup & Croissant Motif -->
  <!-- Drip 1 -->
  <path d="M50 18 C50 18, 57 28, 57 34 C57 38.5 53.8 41 50 41 C46.2 41 43 38.5 43 34 C43 28, 50 18, 50 18 Z" fill="url(#goldDrip)"/>
  
  <!-- Baker's Whisk / Croissant Arch / Coffee Cup -->
  <path d="M26 48 C26 48, 28 72, 50 72 C72 72, 74 48, 74 48" stroke="url(#goldDrip)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M74 54 C81 54, 84 62, 73 66" stroke="url(#goldDrip)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Steam Curves -->
  <path d="M38 35 Q41 38 38 42" stroke="#f5c276" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M62 35 Q65 38 62 42" stroke="#f5c276" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  
  <!-- Base Pedestal -->
  <line x1="34" y1="78" x2="66" y2="78" stroke="url(#goldDrip)" stroke-width="4" stroke-linecap="round"/>
</svg>
